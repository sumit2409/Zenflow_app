name: Zenflow uptime heartbeat

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenflow-uptime
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify canonical health endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --max-time 12 --retry 2 --retry-delay 3 --retry-all-errors \
            --header 'Cookie:' \
            --output /tmp/health.json \
            https://zenflow.bio/api/health
          test "$(tr -d '[:space:]' < /tmp/health.json)" = '{"status":"ok"}'
      - name: Alert after failure
        if: failure() && secrets.UPTIME_ALERT_WEBHOOK != ''
        env:
          ALERT_WEBHOOK: ${{ secrets.UPTIME_ALERT_WEBHOOK }}
        run: curl --fail --silent --show-error --max-time 10 -X POST -H 'Content-Type: application/json' --data '{"text":"Zenflow health check failed. Review the GitHub Actions uptime workflow."}' "$ALERT_WEBHOOK"
